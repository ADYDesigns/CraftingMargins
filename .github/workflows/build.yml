# Builds the app and runs every test on Windows and on a Mac, each time code is pushed to
# GitHub or a pull request is opened.  Nothing has to be switched on: GitHub runs this file
# by itself once it is in the repository.  Results show under the repository's Actions tab,
# and as a green tick or red cross next to each commit.
#
# It only builds and tests.  It never publishes a release.  The Mac app itself is built by
# mac-app.yml.

name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read          # this job only reads the code

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false    # if Windows fails, still show what the Mac says (and the other way round)
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # The app targets .NET 10 and is built with the .NET 11 SDK, so both are installed:
      # the 11 SDK to compile, the 10 runtime to run the tests.
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Build
        run: dotnet build -c Release

      # The UI tests open the real screens without a display, so they run here too.
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/results.trx'
